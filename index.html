<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YEONG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,200;0,300;1,200;1,300;1,400&family=DM+Mono:wght@300&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #080806;
            --ink: #f0ede6;
            --dim: #444440;
            --faint: #222220;
            --accent: rgba(240,237,230,0.06);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%; height: 100%;
            background: var(--bg);
            color: var(--ink);
            font-family: 'Cormorant Garamond', Georgia, serif;
            overflow: hidden; /* 电脑端保持锁定，靠动态特效 */
            -webkit-font-smoothing: antialiased;
        }

        /* ── CUSTOM CURSOR ── */
        @media (pointer: fine) {
            *, body { cursor: none !important; }
            .cursor-dot {
                position: fixed; width: 5px; height: 5px;
                background: var(--ink); border-radius: 50%;
                pointer-events: none; z-index: 10000;
                transform: translate(-50%,-50%);
                transition: opacity .3s;
                mix-blend-mode: difference;
            }
            .cursor-ring {
                position: fixed; width: 32px; height: 32px;
                border: 1px solid rgba(240,237,230,.25); border-radius: 50%;
                pointer-events: none; z-index: 9999;
                transform: translate(-50%,-50%);
                transition: width .4s ease, height .4s ease, border-color .4s ease;
                mix-blend-mode: difference;
            }
            .cursor-ring.hover {
                width: 56px; height: 56px;
                border-color: rgba(240,237,230,.5);
            }
        }

        /* ── ENTRANCE ── */
        #entrance {
            position: fixed; inset: 0; z-index: 9000;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: var(--bg);
            transition: opacity 1s ease, visibility 1s;
        }
        #entrance.gone { opacity: 0; visibility: hidden; pointer-events: none; }

        .ent-eyebrow {
            font-family: 'DM Mono', monospace;
            font-size: 9px; letter-spacing: .35em;
            color: var(--dim); text-transform: uppercase;
            margin-bottom: 28px;
            opacity: 0; animation: fadeUp .8s ease .2s forwards;
        }
        .ent-name {
            font-size: clamp(64px, 14vw, 180px);
            font-weight: 200; font-style: italic;
            line-height: .85; letter-spacing: -.03em;
            color: var(--ink);
            opacity: 0; animation: fadeUp 1.2s cubic-bezier(.16,1,.3,1) .4s forwards;
        }
        .ent-tagline {
            margin-top: 28px;
            font-family: 'DM Mono', monospace;
            font-size: 9px; letter-spacing: .25em;
            color: var(--dim); text-transform: lowercase;
            opacity: 0; animation: fadeUp .8s ease .9s forwards;
        }
        .ent-prompt {
            position: absolute; bottom: 10%;
            font-family: 'DM Mono', monospace;
            font-size: 8px; letter-spacing: .2em;
            color: var(--dim);
            animation: pulse 2.5s ease-in-out infinite;
        }
        @keyframes pulse { 0%,100%{opacity:.2} 50%{opacity:.7} }
        @keyframes fadeUp { to { opacity:1; transform:translateY(0) } from { opacity:0; transform:translateY(14px) } }

        /* ── TOP BAR ── */
        #topbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 500;
            display: flex; justify-content: space-between; align-items: center;
            padding: 28px 44px;
            opacity: 0; transition: opacity 1s ease .3s;
        }
        #topbar.visible { opacity: 1; }
        .tb-logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 13px; font-style: italic; font-weight: 300;
            letter-spacing: .12em; color: rgba(240,237,230,.5);
        }
        .tb-right {
            display: flex; align-items: center; gap: 28px;
        }
        #bgm-toggle {
            font-family: 'DM Mono', monospace;
            font-size: 8px; letter-spacing: .18em;
            color: var(--dim); text-transform: lowercase;
            background: none; border: none;
            transition: color .3s;
        }
        #bgm-toggle:hover { color: var(--ink); }

        /* ── ROOM ── */
        #room {
            position: fixed; inset: 0; z-index: 100;
            opacity: 0; transition: opacity 1.2s ease .2s, transform 0.1s ease-out;
        }
        #room.visible { opacity: 1; }

        #room::before {
            content: '';
            position: absolute; inset: 0; z-index: 2;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(8,8,6,.7) 100%);
            pointer-events: none;
        }

        #room::after {
            content: '';
            position: absolute; inset: 0; z-index: 1;
            background:
                linear-gradient(to right, transparent calc(50% - .5px), rgba(240,237,230,.03) calc(50% - .5px), rgba(240,237,230,.03) calc(50% + .5px), transparent calc(50% + .5px)),
                linear-gradient(to bottom, transparent calc(50% - .5px), rgba(240,237,230,.03) calc(50% - .5px), rgba(240,237,230,.03) calc(50% + .5px), transparent calc(50% + .5px));
            pointer-events: none;
        }

        /* ── ART PIECES ── */
        .piece {
            position: absolute;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .piece.returning {
            transition: top 1s cubic-bezier(.25,1,.5,1), left 1s cubic-bezier(.25,1,.5,1), transform 1s cubic-bezier(.25,1,.5,1), opacity 0.8s ease;
        }

        .piece-inner {
            position: relative;
            box-shadow:
                0 0 0 1px rgba(240,237,230,.04),
                0 8px 40px rgba(0,0,0,.6),
                0 2px 8px rgba(0,0,0,.4);
            transition: box-shadow .6s ease, transform .6s ease;
            min-height: 50px;
        }

        .piece:hover .piece-inner {
            box-shadow:
                0 0 0 1px rgba(240,237,230,.1),
                0 16px 64px rgba(0,0,0,.7),
                0 4px 16px rgba(0,0,0,.5);
            transform: scale(1.015);
        }

        .piece img {
            width: 100%; display: block;
            filter: brightness(.88) saturate(.9);
            transition: filter .6s ease;
        }
        .piece img:not([src]), .work-item img:not([src]) { opacity: 0; } 
        
        .piece:hover img {
            filter: brightness(1) saturate(1);
        }

        .piece-label {
            position: absolute;
            bottom: -26px; left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            font-family: 'DM Mono', monospace;
            font-size: 8px; letter-spacing: .22em;
            color: rgba(240,237,230,.35);
            text-transform: lowercase;
            opacity: 0;
            transition: opacity .4s ease;
            pointer-events: none;
        }
        .piece:hover .piece-label { opacity: 1; }

        #p-ecstasy   { top: 17vh; left: 50vw; width: clamp(100px, 13vw, 200px); }
        #p-greydays  { top: 42vh; left: 20vw; width: clamp(90px, 11vw, 170px); }
        #p-elsewhere { top: 38vh; left: 80vw; width: clamp(100px, 13vw, 200px); }
        #p-untitled  { top: 55vh; left: 50vw; width: clamp(130px, 20vw, 280px); }
        #p-growth    { top: 78vh; left: 28vw; width: clamp(80px, 10vw, 150px); }
        #p-dream     { top: 76vh; left: 74vw; width: clamp(80px, 9vw,  140px); }

        /* drift animations */
        @keyframes d1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-3px, 4px)} }
        @keyframes d2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(4px,-3px)} }
        @keyframes d3 { 0%,100%{transform:translate(0,0)} 33%{transform:translate(-2px,-4px)} 66%{transform:translate(3px,2px)} }
        @keyframes breathe { 0%,100%{opacity:.82} 50%{opacity:1} }

        .drift-a { animation: d1 16s ease-in-out infinite; }
        .drift-b { animation: d2 20s ease-in-out infinite; }
        .drift-c { animation: d3 13s ease-in-out infinite; }
        .breathe { animation: breathe 10s ease-in-out infinite; }

        #room:not(.locked):hover .piece:not(:hover) { opacity: .28; }
        .piece.faded { opacity: 0 !important; pointer-events: none !important; transition: opacity .8s ease !important; }
        .piece.selected { opacity: 1 !important; z-index: 200 !important; }

        /* ── GALLERY PANEL ── */
        #gallery {
            position: fixed; inset: 0; z-index: 600;
            background: var(--bg);
            overflow-y: auto; overflow-x: hidden;
            opacity: 0; visibility: hidden;
            transition: opacity 1.2s ease, visibility 1.2s;
            padding: 0;
        }
        #gallery.open { opacity: 1; visibility: visible; }

        .gallery-header {
            position: sticky; top: 0; z-index: 850;
            display: flex; justify-content: space-between; align-items: flex-end;
            padding: 40px 56px 32px;
            border-bottom: 1px solid rgba(240,237,230,.06);
            background: rgba(8,8,6,.9);
            backdrop-filter: blur(16px);
        }
        .gallery-series-name {
            font-size: clamp(24px, 4vw, 52px);
            font-weight: 200; font-style: italic;
            letter-spacing: -.01em; line-height: 1;
            color: var(--ink);
        }
        .gallery-back {
            font-family: 'DM Mono', monospace;
            font-size: 8px; letter-spacing: .2em;
            color: var(--dim); text-transform: lowercase;
            background: none; border: none;
            transition: color .3s; padding-bottom: 4px;
        }
        .gallery-back:hover { color: var(--ink); }

        .gallery-works {
            display: flex; flex-direction: column;
            align-items: center;
            gap: 20vh;
            padding: 14vh 10vw 20vh;
            max-width: 900px;
            margin: 0 auto;
        }

        .work-item {
            width: 100%;
            opacity: 0; transform: translateY(32px);
            transition: opacity 1s ease, transform 1s cubic-bezier(.16,1,.3,1);
        }
        .work-item.in { opacity: 1; transform: none; }

        .work-item img {
            width: 100%; display: block;
            box-shadow: 0 20px 80px rgba(0,0,0,.5);
            filter: brightness(.9);
            transition: filter .5s ease, transform .5s ease;
        }
        .work-item:hover img {
            filter: brightness(1);
            transform: scale(1.005);
        }

        .work-info {
            margin-top: 20px; padding: 0 2px;
            display: flex; justify-content: space-between; align-items: baseline;
            opacity: 0; transition: opacity .8s ease .3s;
        }
        .work-item.in .work-info { opacity: 1; }

        .work-title {
            font-size: clamp(14px, 1.6vw, 18px);
            font-style: italic; font-weight: 300;
            color: rgba(240,237,230,.7); line-height: 1.4;
            max-width: 70%;
        }
        .work-meta {
            font-family: 'DM Mono', monospace;
            font-size: 8px; letter-spacing: .12em;
            color: var(--dim); text-align: right;
            line-height: 1.8;
        }

        /* ── LIGHTBOX (修复遮挡卡死的核心样式) ── */
        #lb {
            position: fixed; inset: 0; z-index: 800;
            background: rgba(4,4,3,.98);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden;
            transition: opacity .4s ease, visibility .4s;
        }
        #lb.open { opacity: 1; visibility: visible; }

        /* 图片容器降低 z-index 释放上层空间 */
        .lb-img-wrap {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            padding: 80px 56px 80px;
            z-index: 810; 
        }
        #lb-img {
            max-width: 100%; max-height: 100%;
            object-fit: contain; display: block;
            opacity: 0; transition: opacity .4s ease;
            box-shadow: 0 32px 120px rgba(0,0,0,.6);
        }
        #lb-img.shown { opacity: 1; }

        .lb-caption {
            position: absolute; bottom: 36px; left: 56px;
            opacity: 0; transition: opacity .4s ease;
            z-index: 830;
        }
        .lb-caption.shown { opacity: 1; }
        .lb-caption-title {
            font-size: 15px; font-style: italic; font-weight: 300;
            color: rgba(240,237,230,.7); margin-bottom: 6px;
            max-width: 480px; line-height: 1.5;
        }
        .lb-caption-meta {
            font-family: 'DM Mono', monospace;
            font-size: 8px; letter-spacing: .12em;
            color: rgba(240,237,230,.25);
        }

        /* 大幅提升 close 按钮图层（z-index: 850），增加 padding 扩大点击范围 */
        #lb-close {
            position: absolute; top: 28px; right: 44px;
            font-family: 'DM Mono', monospace;
            font-size: 8px; letter-spacing: .2em;
            color: rgba(240,237,230,.4);
            background: none; border: none;
            transition: color .3s;
            padding: 15px; 
            margin: -15px;
            z-index: 850; 
        }
        #lb-close:hover { color: rgba(240,237,230,.9); }

        .lb-nav {
            position: absolute; bottom: 36px; right: 44px;
            display: flex; gap: 16px;
            z-index: 830;
        }
        .lb-nav button {
            font-family: 'DM Mono', monospace;
            font-size: 8px; letter-spacing: .15em;
            color: rgba(240,237,230,.2);
            background: none; border: none;
            padding: 6px; transition: color .3s;
        }
        .lb-nav button:hover { color: rgba(240,237,230,.6); }

        /* ── FOOTER ── */
        #footer {
            position: fixed; bottom: 28px; left: 50%;
            transform: translateX(-50%); z-index: 400;
            opacity: 0; transition: opacity 1s ease .4s;
        }
        #footer.visible { opacity: 1; }
        #footer a {
            font-family: 'DM Mono', monospace;
            font-size: 8px; letter-spacing: .2em;
            color: var(--dim); text-decoration: none; text-transform: lowercase;
            transition: color .3s;
        }
        #footer a:hover { color: var(--ink); }

        /* ── MOBILE ── */
        @media (max-width: 768px) {
            html, body {
                overflow-y: auto !important;
                height: auto !important;
            }
            #room {
                position: relative !important;
                height: auto !important;
                min-height: 100vh;
                padding-top: 80px;
                padding-bottom: 100px;
                opacity: 0;
                transition: opacity 1.2s ease .2s;
                transform: none !important;
            }
            #p-ecstasy, #p-greydays, #p-elsewhere, #p-untitled, #p-growth, #p-dream {
                position: relative !important; top: auto !important; left: auto !important;
                transform: none !important; width: 80vw !important;
                margin: 60px auto !important; display: block;
            }
            .piece-label {
                opacity: 1 !important;
                bottom: -32px;
                color: rgba(240,237,230,.6);
            }
            #room::after { display: none; }
            
            #footer {
                position: relative !important;
                bottom: auto !important; left: auto !important; transform: none !important;
                text-align: center; margin-top: 40px; padding-bottom: 40px;
            }

            .gallery-header { padding: 28px 24px 20px; }
            .gallery-works { padding: 10vh 24px 16vh; gap: 12vh; }
            .lb-img-wrap { padding: 64px 20px 90px; }
            .lb-caption { left: 20px; bottom: 24px; }
            .lb-nav { right: 20px; bottom: 24px; }
            #topbar { padding: 20px 24px; position: absolute; }
            #lb-close { right: 24px; top: 24px; font-size: 9px; }
        }
    </style>
</head>

<div class="cursor-dot" id="cdot"></div>
<div class="cursor-ring" id="cring"></div>

<div id="entrance">

</div>

<div id="topbar">

    <div class="tb-right">

    </div>
</div>

<div id="room">

    <div class="piece" id="p-ecstasy" data-series="ecstasy">
        <div class="drift-a breathe">
            <div class="piece-inner">
                <img src="Nothing but the Night.jpg" alt="Ecstasy that ends in nothing">
            </div>
            <span class="piece-label">ecstasy that ends in nothing</span>
        </div>
    </div>

    <div class="piece" id="p-greydays" data-series="greydays">
        <div class="drift-b breathe">
            <div class="piece-inner">
                <img src="My body holds a river.jpg" alt="grey days">
            </div>
            <span class="piece-label">grey days</span>
        </div>
    </div>

    <div class="piece" id="p-elsewhere" data-series="elsewhere">
        <div class="drift-c breathe">
            <div class="piece-inner">
                <img src="I saw the cracks in your halo and stayed.jpg" alt="elsewhere">
            </div>
            <span class="piece-label">elsewhere</span>
        </div>
    </div>

    <div class="piece" id="p-untitled" data-series="untitled">
        <div class="drift-b breathe">
            <div class="piece-inner">
                <img src="Clean us like the rain in spring.png" alt="Untitled">
            </div>
            <span class="piece-label">untitled</span>
        </div>
    </div>

    <div class="piece" id="p-growth" data-series="growth">
        <div class="drift-a breathe">
            <div class="piece-inner">
                <img src="The flowers don't know I'm dying here.jpg" alt="Let me know">
            </div>
            <span class="piece-label">do i still got time to grow</span>
        </div>
    </div>

    <div class="piece" id="p-dream" data-series="dream">
        <div class="drift-c breathe">
            <div class="piece-inner">
                <img src="mmexport269b5266828106f76bea3bfb92356f75_1777309536855.png" alt="Dream Only">
            </div>
            <span class="piece-label">dream only</span>
        </div>
    </div>

</div>

<div id="gallery">
    <div class="gallery-header">
        <h2 class="gallery-series-name" id="gallery-title"></h2>
        <button class="gallery-back" id="gallery-back">← back to room</button>
    </div>
    <div class="gallery-works" id="gallery-works"></div>
</div>

<div id="lb">
    <button id="lb-close">[ close ]</button>
    <div class="lb-img-wrap" id="lb-click-zone">
        <img src="" id="lb-img" alt="">
    </div>
    <div class="lb-caption" id="lb-caption">
        <div class="lb-caption-title" id="lb-title"></div>
        <div class="lb-caption-meta" id="lb-meta"></div>
    </div>
    <div class="lb-nav">
        <button id="lb-prev">← prev</button>
        <button id="lb-next">next →</button>
    </div>
</div>

<div id="footer">
    <a href="https://www.instagram.com/xzua.no?igsh=dTl2YzI2ZXNnbWpk" target="_blank" rel="noopener noreferrer">instagram</a>
</div>

<audio id="bgm" loop preload="auto">
    <source src="致青春.mp3" type="audio/mpeg">
</audio>

            { src: "No one knows.jpg", title: "No one knows", year: '2019', medium: 'Acrylic on canvas' }
        ]
    },
    dream: {
        name: 'Dream Only',
        works: [
            { src: "mmexport269b5266828106f76bea3bfb92356f75_1777309536855.png", title: "In this world right now I only have you", year: '2018', medium: 'Procreate on iPad' }
        ]
    }
};

const entrance  = document.getElementById('entrance');
const topbar    = document.getElementById('topbar');
const room      = document.getElementById('room');
const footer    = document.getElementById('footer');
const gallery   = document.getElementById('gallery');
const gTitle    = document.getElementById('gallery-title');
const gWorks    = document.getElementById('gallery-works');
const gBack     = document.getElementById('gallery-back');
const lb        = document.getElementById('lb');
const lbImg     = document.getElementById('lb-img');
const lbClickZone = document.getElementById('lb-click-zone');
const lbCaption = document.getElementById('lb-caption');
const lbTitle   = document.getElementById('lb-title');
const lbMeta    = document.getElementById('lb-meta');
const lbClose   = document.getElementById('lb-close');
const lbPrev    = document.getElementById('lb-prev');
const lbNext    = document.getElementById('lb-next');
const bgmToggle = document.getElementById('bgm-toggle');
const bgm       = document.getElementById('bgm');
const pieces    = document.querySelectorAll('.piece');

let bgmPlaying = false;
let currentWorks = [];
let currentLbIdx = 0;

// ── Cursor ──
const cdot  = document.getElementById('cdot');
const cring = document.getElementById('cring');
let cx=0,cy=0,rx=0,ry=0;
if (cdot && cring) {
    document.addEventListener('mousemove', e => {
        cx = e.clientX; cy = e.clientY;
        cdot.style.left = cx+'px'; cdot.style.top = cy+'px';
    });
    (function loop() {
        rx += (cx-rx)*.12; ry += (cy-ry)*.12;
        cring.style.left = rx+'px'; cring.style.top = ry+'px';
        requestAnimationFrame(loop);
    })();
    const hovers = () => document.querySelectorAll('.piece, .gallery-back, #bgm-toggle, #gallery-back, #lb-close, .lb-nav button, #footer a, .work-item img');
    document.addEventListener('mouseover', e => { if ([...hovers()].some(el=>el.contains(e.target))) cring.classList.add('hover'); });
    document.addEventListener('mouseout',  e => { if ([...hovers()].some(el=>el.contains(e.target))) cring.classList.remove('hover'); });
}

// ── Parallax ──
document.addEventListener('mousemove', e => {
    if (room.classList.contains('locked') || window.innerWidth <= 768) return;
    const dx = (window.innerWidth/2  - e.clientX) / 50;
    const dy = (window.innerHeight/2 - e.clientY) / 50;
    room.style.transform = `translate(${dx}px,${dy}px)`;
});

// ── Enter ──
entrance.addEventListener('click', () => {
    bgm.volume = 0.25;
    bgm.play().then(() => { bgmPlaying = true; bgmToggle.textContent = 'music · on'; }).catch(()=>{});
    entrance.classList.add('gone');
    setTimeout(() => {
        room.classList.add('visible');
        topbar.classList.add('visible');
        footer.classList.add('visible');
    }, 200);
}, { once: true });

// ── BGM ──
bgmToggle.addEventListener('click', e => {
    e.stopPropagation();
    if (bgmPlaying) { bgm.pause(); bgmToggle.textContent = 'music · off'; }
    else            { bgm.play();  bgmToggle.textContent = 'music · on';  }
    bgmPlaying = !bgmPlaying;
});

// ── Open Series ──
function openSeries(key) {
    const s = seriesData[key];
    if (!s) return;
    currentWorks = s.works;
    gTitle.textContent = s.name;
    gWorks.innerHTML = '';

    s.works.forEach((w, i) => {
        const item = document.createElement('div');
        item.className = 'work-item';
        item.innerHTML = `
            <img src="${w.src}" alt="${w.title}" loading="lazy">
            <div class="work-info">
                <span class="work-title">${w.title}</span>
                <span class="work-meta">${w.year}<br>${w.medium}</span>
            </div>`;
        item.querySelector('img').addEventListener('click', () => openLb(i));
        gWorks.appendChild(item);
    });

    gallery.classList.add('open');
    gallery.scrollTop = 0;

    if(window.innerWidth <= 768) {
        document.documentElement.style.overflow = 'hidden';
        document.body.style.overflow = 'hidden';
    }

    const obs = new IntersectionObserver(entries => {
        entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('in'); });
    }, { threshold: 0.08 });
    setTimeout(() => gWorks.querySelectorAll('.work-item').forEach(el => obs.observe(el)), 100);
}

// ── Piece click ──
pieces.forEach(p => {
    p.addEventListener('click', () => {
        if (room.classList.contains('locked')) return;
        room.classList.add('locked');
        
        if (window.innerWidth > 768) {
            room.style.transform = 'translate(0,0)';
            topbar.style.opacity = '0';
            footer.style.opacity = '0';
            pieces.forEach(other => { if (other !== p) other.classList.add('faded'); });
            p.classList.add('selected');
            p.classList.remove('returning');
            p.style.transition = 'all 1s cubic-bezier(.25,1,.5,1)';
            p.style.top  = '50vh';
            p.style.left = '50vw';
            p.style.transform = 'translate(-50%,-50%) scale(1.1)';
            setTimeout(() => openSeries(p.dataset.series), 900);
        } else {
            openSeries(p.dataset.series);
        }
    });
});

// ── Back to room ──
gBack.addEventListener('click', () => {
    gallery.classList.remove('open');
    
    if(window.innerWidth <= 768) {
        document.documentElement.style.overflowY = 'auto';
        document.body.style.overflowY = 'auto';
    }

    setTimeout(() => {
        room.classList.remove('locked');
        if (window.innerWidth > 768) {
            topbar.style.opacity = '1';
            footer.style.opacity = '1';
            pieces.forEach(p => {
                p.classList.remove('faded','selected');
                p.classList.add('returning');
                p.style.top = ''; p.style.left = ''; p.style.transform = '';
                setTimeout(() => { p.classList.remove('returning'); p.style.transition = ''; }, 1000);
            });
        }
    }, 600);
});

// ── Lightbox ──
function openLb(idx) {
    currentLbIdx = idx;
    const w = currentWorks[idx];
    
    if (lb.classList.contains('open')) {
        lbImg.classList.remove('shown');
        lbCaption.classList.remove('shown');
        setTimeout(() => { renderLbContent(w); }, 300);
    } else {
        lb.classList.add('open');
        renderLbContent(w);
    }
}

function renderLbContent(w) {
    lbImg.src = w.src;
    lbImg.onload = () => lbImg.classList.add('shown');
    lbTitle.textContent = w.title;
    lbMeta.textContent  = `${w.year} — ${w.medium}`;
    lbCaption.classList.add('shown');
}

function closeLb() {
    lb.classList.remove('open');
    lbImg.classList.remove('shown');
    lbCaption.classList.remove('shown');
    setTimeout(() => { lbImg.src = ''; }, 400);
}

function lbGo(dir) {
    const n = (currentLbIdx + dir + currentWorks.length) % currentWorks.length;
    openLb(n);
}

// 按钮独立点击关闭（加了阻止冒泡）
lbClose.addEventListener('click', (e) => {
    e.stopPropagation();
    closeLb();
});

// 核心修复：点击大图之外的任意黑色空白区域也能直接关闭
lbClickZone.addEventListener('click', (e) => {
    if (e.target === lbClickZone) {
        closeLb();
    }
});
lb.addEventListener('click', (e) => {
    if (e.target === lb) {
        closeLb();
    }
});

lbPrev.addEventListener('click', (e) => { e.stopPropagation(); lbGo(-1); });
lbNext.addEventListener('click', (e) => { e.stopPropagation(); lbGo(1); });

document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (lb.classList.contains('open')) closeLb(); else if (gallery.classList.contains('open')) gBack.click(); }
    if (lb.classList.contains('open')) {
        if (e.key === 'ArrowLeft')  lbGo(-1);
        if (e.key === 'ArrowRight') lbGo(1);
    }
});
</script>
</body>
</html>
